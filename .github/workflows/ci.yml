name: CI

# Discharges plan §10 "serializer output is byte-identical for the same logical
# state ... verified across platforms and Node versions in CI", and makes the
# dependency-boundary lint (packages/sanity-overlay-testkit/test/core-boundaries.test.ts)
# a gate that actually runs on every push instead of a test nobody executes.

on:
  # `push` is unfiltered on purpose: work here lands directly on branches (and
  # on main) without always going through a PR, and the audit's complaint was
  # precisely that these tests run on nobody's push. `pull_request` additionally
  # covers fork contributions, which `push` never sees. Same-repo PRs therefore
  # get one run per event; the concurrency group below keeps that from piling up.
  push:
  pull_request:

# A superseded push has nothing to tell us; cancel it rather than pay for it.
# `cancel-in-progress` is NOT a retry -- a run that finishes red stays red.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: test (node ${{ matrix.node }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    strategy:
      # Report every leg. One red leg must not hide the state of the others --
      # a platform- or version-specific serializer drift is exactly the failure
      # this matrix exists to surface, and we want to see which legs it hits.
      fail-fast: false
      matrix:
        # Two genuinely different platforms: Linux (ext4, case-sensitive) and
        # macOS (APFS, case-insensitive by default). Windows is deliberately
        # absent for now -- the repo has no .gitattributes, so a Windows
        # checkout would rewrite committed LF fixtures (e.g.
        # examples/kitchen-sink/spikeB-proxy/proxy-log.jsonl, which the replay
        # tests split on '\n') to CRLF and fail for reasons that have nothing
        # to do with the code. Add `* text=auto eol=lf` first, then add
        # windows-latest here.
        os: [ubuntu-latest, macos-latest]
        # 22.22.2 is the version pinned for local development (see
        # `packageManager` in package.json and the nvm-installed toolchain);
        # it stays in the matrix exactly. 24 is the next line up, so a
        # forward-incompatibility shows up here rather than on someone's laptop.
        node: ['22.22.2', '24']

    steps:
      - uses: actions/checkout@v4

      # Must precede setup-node: `cache: pnpm` below needs pnpm on PATH.
      # No `version:` input on purpose -- action-setup@v4 reads pnpm@10.33.2
      # from the root package.json `packageManager` field, so the workflow
      # cannot drift from the repo's pinned package manager.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      # Frozen: CI installs what the lockfile says or fails. It never resolves
      # fresh versions, so a green run is reproducible from the commit alone.
      # The whole workspace is installed (not just the testkit) because the
      # suite imports examples/kitchen-sink -- both its spike sources and its
      # @sanity/client.
      - run: pnpm install --frozen-lockfile

      # NO secrets and NO env block, by design. The only credentialed suite is
      # test/hosted-parity.test.ts; it is wrapped in `describe.skipIf(!cfg)`
      # where cfg comes from hostedConfigFromEnv(), which returns null unless
      # SANITY_PROJECT_ID + SANITY_BASE_DATASET + SANITY_API_READ_TOKEN are all
      # set. src/env.ts only reads a repo-root .env, which is gitignored and so
      # never present in CI. Verified locally: with those three vars blanked the
      # suite is 39 files passed / 1 skipped, 2637 passed / 13 skipped -- the 13
      # being exactly hosted-parity's cases. Do not add a token here.
      #
      # NO retries, deliberately. Two suites (test/action-echo.test.ts,
      # test/proxy-concurrency.test.ts) are known to flake under parallel load.
      # A flake is a real defect in a suite whose whole job is proving
      # concurrency invariants -- retrying it would delete the only signal we
      # have. Do not add `--retry`, and do not add `retry:` to a vitest config.
      - run: pnpm --filter sanity-overlay-testkit test

  # ---------------------------------------------------------------------------
  # typecheck
  #
  # This job was disabled on the grounds that @types/node was installed nowhere,
  # so `tsc` reported ~180 unresolved-builtin errors for the testkit alone and a
  # typecheck proved nothing. That is no longer true: @types/node is now declared
  # and installed for sanity-overlay-store-fs and sanity-overlay-testkit, and
  # three packages typecheck completely clean. Those three are gated here.
  #
  # WHAT IT COVERS, and why each one is in:
  #
  #   sanity-overlay-core      0 errors. No node: builtins at all, so it needs
  #                            no @types/node and cannot regress on one.
  #   sanity-overlay-store-fs  0 errors. Declares @types/node itself, and the
  #                            entry IS in pnpm-lock.yaml, so a frozen install
  #                            reproduces the clean run.
  #   sanity-overlay-query     0 errors. Its only node: imports live in
  #                            lint/check-queries.mjs, which is JavaScript and
  #                            outside the tsconfig `include` roots -- tsc never
  #                            opens it, so no @types/node is needed for this
  #                            project to be gated.
  #   sanity-overlay-next      0 errors, MEASURED with @types/node reachable
  #                            (verified 2026-08-06 by linking the installed
  #                            copy into the package and re-running tsc: clean).
  #                            src/server.ts is TypeScript inside `include` and
  #                            imports node:http and node:path, so the project
  #                            needs @types/node -- which it already DECLARES.
  #                            It is gated rather than excluded because nothing
  #                            has to be added to make it clean; the entry just
  #                            has to be installed, which is the same repo-root
  #                            `pnpm install` the cli exclusion below is waiting
  #                            on. Until that install lands and pnpm-lock.yaml is
  #                            committed, the `pnpm install --frozen-lockfile`
  #                            step above fails first and this job never runs at
  #                            all -- so gating it cannot make CI red in a way
  #                            the install step is not already red for.
  #
  # WHAT IT DOES NOT COVER. Each exclusion is a measured error count, not a
  # guess, and each names the one thing that clears it:
  #
  #   sanity-overlay-cli       0 errors, RE-MEASURED 2026-08-06. It was excluded
  #                            because packages/sanity-overlay-cli was absent
  #                            from the `importers` block of pnpm-lock.yaml, so
  #                            its already-DECLARED @types/node was never
  #                            installed. That has been re-locked; the exclusion
  #                            was stale and the package is gated above.
  #                            It also now imports two modules from
  #                            sanity-overlay-studio (src/ci/scan.ts →
  #                            classifyTokenEnvKey, HOSTED_FEATURES), which is
  #                            the second reason both are gated together: the
  #                            §37 Phase 6 write-token and unsupported-plugin
  #                            checks reuse the Studio's own rules rather than
  #                            restating them, so a type change in either
  #                            package must break here and not in a preview.
  #
  #   sanity-overlay-studio    0 errors, RE-MEASURED 2026-08-06. The one error
  #                            (TS2307 `Cannot find module 'groq-js'` at
  #                            src/client/readPlan.ts) was a genuinely undeclared
  #                            dependency; groq-js is now declared and present in
  #                            pnpm-lock.yaml, so the exclusion was stale. This
  #                            is the package a consumer actually installs, and
  #                            an undeclared import in it is an
  #                            ERR_MODULE_NOT_FOUND at Studio boot on their
  #                            machine — exactly the species a typecheck gate
  #                            catches and nothing else here does.
  #
  # WHAT IT STILL DOES NOT COVER:
  #
  #   sanity-overlay-client    16 errors, ALL of them missing-@types/node
  #                            (TS2307 on node:fs / node:path, TS2503 NodeJS,
  #                            TS2580 process). Verified: with @types/node
  #                            reachable the project is clean, 0 errors. Blocked
  #                            on a dependency install:
  #
  #                              pnpm --filter sanity-overlay-client add -D -E "@types/node@^22.20.1"
  #
  #                            (Also pinned as KNOWN_MISSING in
  #                            packages/sanity-overlay-testkit/test/repo-manifests.test.ts,
  #                            which goes red when the entry is added and the
  #                            list is not cleaned up.)
  #
  #   sanity-overlay-testkit   24 errors, none of them in this package's own
  #                            harness: 7 in test/assets-model.test.ts, 6 in
  #                            test/studio-observable-contract.test.ts, 2 each in
  #                            test/write-guard.test.ts and
  #                            test/client-revalidate.test.ts, 1 each in
  #                            test/proxy-tls-live.test.ts,
  #                            test/core-boundaries.test.ts and the three
  #                            TS7016s for untyped .mjs imports from
  #                            examples/kitchen-sink, plus the studio groq-js
  #                            error above reached through a relative import.
  #                            Add this project once those land.
  #
  # The exclusion list is not free-form: the set of packages named below is
  # pinned in test/repo-manifests.test.ts ("the typecheck gate covers every
  # package it can"), which goes red if a package is added to packages/ and
  # neither gated nor excluded, or if this list and that one drift.
  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Deliberately NOT matrixed, unlike the test job. `typescript` is pinned to
    # an exact version in the testkit manifest and resolved by the lockfile, so
    # every leg of that matrix would run the identical compiler over the
    # identical sources and produce the identical answer. The test job's matrix
    # exists to catch filesystem and Node-runtime drift; tsc sees neither.
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # tsc is invoked from the testkit for every project: it is the only
      # package that pins typescript. `-p <dir>` still uses each project's own
      # tsconfig, and each project's own node_modules/@types is still found.
      #
      # One step per project on purpose. A single chained command would stop at
      # the first failure and the log would name only that project; separate
      # steps make the failing one obvious in the checks UI.
      - name: typecheck sanity-overlay-core
        run: pnpm --filter sanity-overlay-testkit exec tsc --noEmit -p ../sanity-overlay-core
      - name: typecheck sanity-overlay-store-fs
        run: pnpm --filter sanity-overlay-testkit exec tsc --noEmit -p ../sanity-overlay-store-fs
      - name: typecheck sanity-overlay-query
        run: pnpm --filter sanity-overlay-testkit exec tsc --noEmit -p ../sanity-overlay-query
      - name: typecheck sanity-overlay-next
        run: pnpm --filter sanity-overlay-testkit exec tsc --noEmit -p ../sanity-overlay-next
      - name: typecheck sanity-overlay-cli
        run: pnpm --filter sanity-overlay-testkit exec tsc --noEmit -p ../sanity-overlay-cli
      - name: typecheck sanity-overlay-studio
        run: pnpm --filter sanity-overlay-testkit exec tsc --noEmit -p ../sanity-overlay-studio

  # ---------------------------------------------------------------------------
  # query-lint
  #
  # PRD §22.5: "[MUST] CI runs the codemod in check mode and the lint rule in
  # error mode after migration." Until this job existed, both halves of that
  # requirement were reachable only by typing a path, which is documentation
  # rather than enforcement -- an unregistered query, a direct @sanity/client or
  # a native Sanity Live subscription could land and CI stayed green.
  #
  # Both steps are the SAME code the runtime uses. The lint step loads
  # M_LOCAL_QUERIES in process rather than a JSON manifest, so the gate cannot
  # drift from the registry the evaluator resolves against, and the codemod step
  # runs in check mode, so it never writes in CI.
  #
  # WHAT IT COVERS, and why the scope is these five and not `packages/`:
  #
  #   sanity-overlay-core       0 findings over 85 files
  #   sanity-overlay-store-fs   0 over 9
  #   sanity-overlay-cli        0 over 25
  #   sanity-overlay-next       0 over 7
  #   sanity-overlay-query      0 over 14 (src + parity), and 15 GROQ literals
  #                             RESOLVED to registered query IDs -- so the gate
  #                             is reading real queries, not scanning nothing.
  #
  # Every count above was measured, 2026-08-06, by running the command below.
  # If a leg here ever reports "0 literals scanned", the paths are wrong and the
  # gate is vacuous.
  #
  # WHAT IT DOES NOT COVER. Each exclusion is a measured count and a reason, not
  # an oversight:
  #
  #   sanity-overlay-client   3 findings, ALL in src/base.ts -- the base-request
  #   sanity-overlay-studio   6 findings, 5 of them the same shape in
  #                           src/client/{reads,incomingReferences}.ts.
  #                           These are the PLANNER's own base requests
  #                           (`*[_id in $ids]`, `*[_type in $types]`, and the
  #                           dynamic field predicate §22.6 step 5 builds). The
  #                           rule is specified for "preview-aware APPLICATION
  #                           code" (§22.5); the layer that CONSTRUCTS candidate
  #                           requests is the one thing that must build GROQ
  #                           dynamically, and registering those would mean
  #                           registering the planner's internals as frontend
  #                           queries. The 6th is a real finding and is reported
  #                           to the studio owner:
  #                           packages/sanity-overlay-studio/src/index.ts:28
  #                           imports @sanity/client directly.
  #
  #   sanity-overlay-testkit  301 findings. Test fixtures hold GROQ literals by
  #                           definition -- that is what a parity fixture IS.
  #                           Linting the suite would be linting the oracle.
  #
  #   examples/**             10 findings across kitchen-sink (spike sources,
  #                           PRD §0.6 disposable) and 2 in
  #                           examples/local-site/src/queries.ts, which is the
  #                           one genuine FRONTEND MIGRATION target in this repo
  #                           and is owned elsewhere. Adding examples/local-site
  #                           here is the next step for whoever owns it: register
  #                           its two article queries, run
  #                           `sanity-overlay codemod --write examples/local-site`,
  #                           then add the path to both steps below.
  #
  # A CONSUMING PROJECT points these at its own app directory instead. That is
  # the whole intent of §22.5 -- this repo has no production frontend of its own
  # (§0.0: nothing here writes to a Sanity dataset).
  query-lint:
    name: query lint (PRD §22.5)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      # Exit 2 on ANY finding: unregistered GROQ, a query text that drifted from
      # its registered checksum, a dynamically constructed query, a direct
      # @sanity/client import, or a native Sanity Live subscription. Strict is
      # the default and is passed explicitly so a future default change cannot
      # silently downgrade this gate to warn mode.
      - name: unregistered queries and overlay-bypassing clients
        run: >
          node packages/sanity-overlay-cli/bin/sanity-overlay.mjs lint --mode strict
          packages/sanity-overlay-core/src
          packages/sanity-overlay-store-fs/src
          packages/sanity-overlay-cli/src
          packages/sanity-overlay-next/src
          packages/sanity-overlay-query/src
          packages/sanity-overlay-query/parity

      # Check mode, never --write: CI reports that a migration is outstanding,
      # it does not perform one. Exit 2 covers both a pending rewrite and a file
      # the codemod refused, because both are unfinished migration work.
      - name: client-import codemod (check mode)
        run: >
          node packages/sanity-overlay-cli/bin/sanity-overlay.mjs codemod
          packages/sanity-overlay-core/src
          packages/sanity-overlay-store-fs/src
          packages/sanity-overlay-cli/src
          packages/sanity-overlay-next/src
          packages/sanity-overlay-query/src
          packages/sanity-overlay-query/parity
